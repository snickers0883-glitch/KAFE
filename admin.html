<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Админка — Вкусный кофе</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { cream: "#fde6ec", sand: "#f9c9d5", mocha: "#7a1d3a", espresso: "#4a1020", latte: "#f4a9bd" },
      fontFamily: { serif: ["Cormorant Garamond", "serif"], sans: ["Manrope", "system-ui", "sans-serif"] } } } };
  </script>
  <style>
    body { background:linear-gradient(180deg,#fbd3dd,#fde6ec); color:#4a1020; }
    .field { width:100%; background:#fff; border:1px solid #f4a9bd; border-radius:.65rem; padding:.6rem .85rem; outline:none; font-size:.9rem; }
    .field:focus { border-color:#7a1d3a; box-shadow:0 0 0 3px rgba(107,65,41,.15); }
    .btn { display:inline-flex; align-items:center; gap:.4rem; background:#7a1d3a; color:#fff; border-radius:999px; padding:.55rem 1.2rem; font-size:.8rem; font-weight:600; transition:background .2s; }
    .btn:hover { background:#5c1229; } .btn:disabled { opacity:.6; cursor:wait; }
    .btn-ghost { background:transparent; color:#7a1d3a; box-shadow:inset 0 0 0 1px #7a1d3a; } .btn-ghost:hover { background:#7a1d3a; color:#fff; }
    .btn-danger { background:#a33a2c; } .btn-danger:hover { background:#7f2a1f; }
    .tab { padding:.6rem 1.1rem; border-radius:999px; font-size:.85rem; font-weight:600; color:#7a1d3a; }
    .tab.active { background:#7a1d3a; color:#fff; }
    .lbl { display:block; font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:#7a1d3a; margin-bottom:.25rem; }
    th { text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:#7a1d3a; padding:.6rem .75rem; }
    td { padding:.6rem .75rem; border-top:1px solid #f9c9d5; vertical-align:middle; }
  </style>
</head>
<body class="font-sans antialiased">

  <!-- ВХОД -->
  <div id="loginView" class="flex min-h-screen items-center justify-center px-5">
    <form id="loginForm" class="w-full max-w-sm space-y-4 rounded-3xl bg-white/70 p-8 shadow-sm ring-1 ring-sand">
      <h1 class="font-serif text-3xl">Вход в админку</h1>
      <p class="text-sm text-espresso/60">Вкусный кофе · управление сайтом</p>
      <label class="block"><span class="lbl">Логин</span><input id="lLogin" class="field" autocomplete="username" required /></label>
      <label class="block"><span class="lbl">Пароль</span><input id="lPass" type="password" class="field" autocomplete="current-password" required /></label>
      <p id="lMsg" class="min-h-[1.2rem] text-sm text-red-700" role="alert"></p>
      <button class="btn w-full justify-center" id="lBtn">Войти</button>
      <a href="index.html" class="block text-center text-xs text-espresso/50 hover:text-mocha">← на сайт</a>
    </form>
  </div>

  <!-- ПАНЕЛЬ -->
  <div id="appView" class="hidden">
    <header class="sticky top-0 z-30 border-b border-sand bg-cream/90 backdrop-blur">
      <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-5 py-3">
        <div class="flex items-center gap-3">
          <span class="font-serif text-2xl font-semibold text-mocha">Вкусный кофе</span>
          <span id="demoBadge" class="hidden rounded-full bg-amber-200 px-3 py-1 text-xs font-semibold text-amber-900">ДЕМО — нет APPS_SCRIPT_URL</span>
        </div>
        <nav class="flex flex-wrap gap-1">
          <button class="tab active" data-tab="menu">Меню</button>
          <button class="tab" data-tab="site">Сайт</button>
          <button class="tab" data-tab="bookings">Брони <span id="newCount" class="ml-1 hidden rounded-full bg-red-600 px-1.5 text-[10px] text-white"></span></button>
          <button class="tab" data-tab="account">Аккаунт</button>
        </nav>
        <div class="flex items-center gap-3 text-sm"><a href="index.html" target="_blank" class="text-mocha underline">Открыть сайт</a><button id="logout" class="btn btn-ghost">Выйти</button></div>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-5 py-8">

      <!-- МЕНЮ -->
      <section id="tab-menu">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
          <h2 class="font-serif text-2xl">Редактор меню</h2>
          <button id="addItem" class="btn">+ Добавить позицию</button>
        </div>
        <div class="overflow-x-auto rounded-2xl bg-white/70 ring-1 ring-sand">
          <table class="w-full min-w-[720px] text-sm">
            <thead><tr><th></th><th>Название</th><th>Раздел</th><th>Цена</th><th>Показ</th><th></th></tr></thead>
            <tbody id="menuBody"></tbody>
          </table>
        </div>
      </section>

      <!-- САЙТ -->
      <section id="tab-site" class="hidden">
        <div class="mb-4 flex items-center justify-between">
          <h2 class="font-serif text-2xl">Тексты, контакты и картинки</h2>
          <button id="saveSite" class="btn">Сохранить изменения</button>
        </div>
        <form id="siteForm" class="space-y-8"></form>
      </section>

      <!-- БРОНИ -->
      <section id="tab-bookings" class="hidden">
        <div class="mb-4 flex items-center justify-between">
          <h2 class="font-serif text-2xl">Заявки на бронь</h2>
          <button id="reloadBookings" class="btn btn-ghost">Обновить</button>
        </div>
        <div class="overflow-x-auto rounded-2xl bg-white/70 ring-1 ring-sand">
          <table class="w-full min-w-[760px] text-sm">
            <thead><tr><th>Получена</th><th>Имя</th><th>Телефон</th><th>Дата</th><th>Время</th><th>Гостей</th><th>Статус</th><th></th></tr></thead>
            <tbody id="bookBody"></tbody>
          </table>
        </div>
      </section>

      <!-- АККАУНТ -->
      <section id="tab-account" class="hidden max-w-md">
        <h2 class="mb-4 font-serif text-2xl">Смена пароля</h2>
        <form id="pwForm" class="space-y-4 rounded-2xl bg-white/70 p-6 ring-1 ring-sand">
          <label class="block"><span class="lbl">Текущий пароль</span><input id="pwOld" type="password" class="field" autocomplete="current-password" required /></label>
          <label class="block"><span class="lbl">Новый пароль (от 8 символов)</span><input id="pwNew" type="password" class="field" minlength="8" autocomplete="new-password" required /></label>
          <button class="btn">Сменить пароль</button>
        </form>
      </section>
    </main>
  </div>

  <!-- МОДАЛКА ПОЗИЦИИ -->
  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-espresso/50 p-4">
    <form id="itemForm" class="max-h-[92vh] w-full max-w-lg space-y-4 overflow-y-auto rounded-3xl bg-cream p-6 shadow-2xl">
      <h3 id="modalTitle" class="font-serif text-2xl">Позиция меню</h3>
      <input type="hidden" id="fId" />
      <div class="grid grid-cols-2 gap-3">
        <label class="block col-span-2"><span class="lbl">Название</span><input id="fName" class="field" maxlength="80" required /></label>
        <label class="block"><span class="lbl">Раздел</span>
          <select id="fCat" class="field"><option value="coffee">Кофе</option><option value="dessert">Десерты</option></select></label>
        <label class="block"><span class="lbl">Цена, ₸</span><input id="fPrice" type="number" min="0" step="1" class="field" required /></label>
        <label class="block col-span-2"><span class="lbl">Описание / вкусовые ноты</span><textarea id="fDesc" rows="2" maxlength="300" class="field"></textarea></label>
        <label class="block col-span-2"><span class="lbl">Ссылка на картинку (https://…)</span><input id="fImg" class="field" placeholder="https://…" /></label>
        <div class="col-span-2"><img id="fPreview" alt="" class="hidden h-32 w-full rounded-xl object-cover" /></div>
        <label class="block"><span class="lbl">Порядок</span><input id="fSort" type="number" class="field" value="0" /></label>
        <label class="mt-5 flex items-center gap-2 text-sm"><input id="fAvail" type="checkbox" checked class="h-4 w-4" /> Показывать на сайте</label>
      </div>
      <p id="fMsg" class="min-h-[1.2rem] text-sm text-red-700"></p>
      <div class="flex justify-end gap-2"><button type="button" id="fCancel" class="btn btn-ghost">Отмена</button><button class="btn" id="fSave">Сохранить</button></div>
    </form>
  </div>

  <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-[60] -translate-x-1/2 translate-y-4 rounded-full bg-espresso px-5 py-3 text-sm text-white opacity-0 shadow-lg transition duration-300" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
